name: Suggest Debate Argument Node
description: Propose a steelmanned argument node, contested thesis, or verified primary source for any of Dialectica's 22 debate maps.
title: "[Suggestion] "
labels: ["node-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping strengthen **Dialectica**!
        Submissions are automatically validated by GitHub Actions (checking target parent node, schema, tags, duplicate titles, and live source URLs).
        Once approved (`approved-for-pr` label), an automated Pull Request merges the node into `src/data/communityContributions.json`.

        **Tip:** You can fill this form directly, or pre-fill it cleanly using the **"Suggest Node"** button inside [Dialectica](https://wildvegangoose.github.io/debater/).

  - type: dropdown
    id: submission_type
    attributes:
      label: Submission Type
      options:
        - New Argument Node
        - New Contested Thesis
        - Edit Existing Node / Add Source
      default: 0
    validations:
      required: true

  - type: dropdown
    id: topic_id
    attributes:
      label: Debate Topic ID
      description: Select the debate map where this node belongs.
      options:
        - ai-risk
        - israel-palestine
        - economic-policies
        - social-media-censorship
        - big-tech-antitrust
        - crypto-defi
        - crispr-gene-editing
        - liberal-democracy-populism
        - russia-ukraine-nato
        - china-western-order
        - immigration-borders
        - death-penalty
        - capitalism-socialism
        - universal-basic-income
        - globalization-tariffs
        - higher-education-debt
        - future-of-work
        - nuclear-energy
        - climate-growth-degrowth
        - space-exploration
        - drug-decriminalization
        - meritocracy
      default: 0
    validations:
      required: true

  - type: input
    id: parent_id
    attributes:
      label: Target Parent Node ID
      description: Exact ID of the node this argument responds to (e.g. `pillar-ai-alignment`, `thesis-ai-catastrophe-probability`). Pre-filled automatically from the in-app Suggest Node modal.
      placeholder: "thesis-..."
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Logical Role
      description: How does this node relate to its Target Parent?
      options:
        - pro
        - con
        - thesis
      default: 0
    validations:
      required: true

  - type: input
    id: headline
    attributes:
      label: Argument Headline
      description: Crisp, specific statement of the claim (8–160 characters).
      placeholder: "e.g., Compute Thresholds Alone Miss Open-Weight Weight-Poisoning & Biological Risks"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Steelmanned Summary
      description: State the strongest good-faith version of this argument in 2–3 concise sentences without caricature.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Empirical Evidence & Key Takeaways
      description: One factual takeaway, metric, court citation, or treaty clause per line (prefix with `- ` optional).

  - type: textarea
    id: sources
    attributes:
      label: Primary Sources & URLs
      description: "At least one verifiable primary source, formatted one per line: `Title | https://url | Publisher | Category`"
      placeholder: "OECD AI Policy Observatory Report | https://oecd.ai/en/ | OECD | Empirical / Economic Study"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Thematic Lenses
      description: "Comma-separated tags matching Dialectica's DebateTag union (e.g. `AI & Technology, National Security`)."
      placeholder: "AI & Technology"

  - type: textarea
    id: rationale
    attributes:
      label: Maintainer Rationale
      description: Briefly explain why this node fills an evidentiary gap or sharpens steelman balance.

  - type: input
    id: contributor
    attributes:
      label: Attribution / GitHub Handle
      description: Optional credit displayed on the node (leave blank for anonymous / GitHub issue author).
      placeholder: "@yourhandle"

  - type: textarea
    id: json_payload
    attributes:
      label: Structured JSON Payload (Auto-generated by App — Optional)
      description: Optional JSON generated by Dialectica's Suggest Node modal. Leave blank if submitting manually above.
      render: json
