name: Build Android App (APK & Play Store AAB)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release versionName (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync
        env:
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.VITE_CF_ANALYTICS_TOKEN }}
          VITE_GOATCOUNTER_CODE: ${{ vars.VITE_GOATCOUNTER_CODE }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build installable Android APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Steelman-Android.apk
          ls -lh release-apk/Steelman-Android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steelman-Android-APK
          path: release-apk/Steelman-Android.apk
          retention-days: 90

      - name: Build Signed Play Store App Bundle (.aab)
        if: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/steelman-upload.jks
          export ANDROID_KEYSTORE_PATH="/tmp/steelman-upload.jks"
          ./gradlew bundleRelease
          rm -f /tmp/steelman-upload.jks
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store AAB artifact
        if: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Steelman-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Publish downloadable APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          TITLE="Steelman — Android App (Latest APK)"
          NOTES="Download \`Steelman-Android.apk\` directly on your Android phone and tap to install (enable *Install unknown apps* if prompted).

          ### What's inside
          - **Spar Arena:** 5-turn or open sparring with Partner, Oxford, and Socratic styles, live momentum tracking, and automatic Game Tape debriefs.
          - **Deep Critique & Performance Log:** Turn-by-turn strengths, weaknesses, before-to-after proposed revisions, and cross-round Coach Insights.
          - **4 AI Engines:** On-Device AI (WebLLM via WebGPU), Gemini Cloud, Local Server (Ollama/LM Studio), and Offline Templates.
          - **Full Steelman Suite:** Interactive Argument Graph, Outline Feed, and Rebuttal Flashcards across 22 landmark motions."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apk/Steelman-Android.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          else
            gh release create "$TAG" release-apk/Steelman-Android.apk \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
