name: Build Android APK

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build installable Android APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Dialectica-Debate-Android.apk
          ls -lh release-apk/Dialectica-Debate-Android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dialectica-Debate-Android-APK
          path: release-apk/Dialectica-Debate-Android.apk
          retention-days: 90

      - name: Publish downloadable APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          TITLE="Dialectica Debate — Android App (Latest APK)"
          NOTES="Download \`Dialectica-Debate-Android.apk\` directly on your Android phone and tap to install (enable *Install unknown apps* if prompted).

          ### What's inside
          - **Voice Debate Arena (4th Tab):** Conversational AI voice sparring with real-time audio visualizer, live Debate Momentum gauge, rhetoric feedback badges, tactical coaching tips, and live argument-graph coverage tracking across all 22 topics.
          - **4 AI & Voice Modes:**
            1. **Gemini Live Voice** (real-time bidirectional voice + live visual HUD tool calls — bring your own free key from Google AI Studio)
            2. **Gemini Flash Coach** (native Android Speech-to-Text & Text-to-Speech + structured coaching every turn)
            3. **Local / Self-Hosted AI** (connect to Ollama, LM Studio, or any OpenAI-compatible endpoint over Wi-Fi)
            4. **Offline Curated Sparring** (works immediately with zero setup or API key using all 22 curated Dialectica graphs)
          - **Full Dialectica Suite:** Interactive Graph Canvas, Mobile Outline Feed, and Flashcard Quiz Mode."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apk/Dialectica-Debate-Android.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          else
            gh release create "$TAG" release-apk/Dialectica-Debate-Android.apk \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
